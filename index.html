<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Romantic Confession</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            padding: 20px;
            width: 90%;
            max-width: 500px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        p {
            font-size: 16px;
            color: #666;
        }
        .confess-button {
            background-color: #ff4081;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 10px 15px;
            width: 100%;
            cursor: pointer;
            font-size: 18px;
            margin-top: 20px;
        }
        .confess-button:hover {
            background-color: #ff007f;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Romantic Confession</h1>
        <p>Share your feelings and let them know how much they mean to you!</p>
        <button class="confess-button">Confess Your Love</button>
    </div>
</body>
</html>
